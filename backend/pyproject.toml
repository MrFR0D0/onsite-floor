[project]
name = "onsite-floor"
version = "0.1.0"
description = "Self-hosted OEE and shop-floor traceability for small manufacturers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2==2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["onsite_floor"]
branch = true

[tool.coverage.report]
show_missing = true
