[project]
name = "onsite-floor"
version = "0.1.0"
description = "Self-hosted OEE and shop-floor traceability for small manufacturers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2==2.16.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["onsite_floor"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes: unused imports and variables, undefined names
    "I",      # isort: import order
    "D",      # pydocstyle: docstrings
    "B",      # bugbear: likely bugs
    "UP",     # pyupgrade: modern Python syntax
    "S",      # bandit: security issues
    "PT",     # pytest style
    "ANN",    # flake8-annotations: missing type annotations
    "N",      # pep8-naming: naming conventions
    "TID",    # flake8-tidy-imports: absolute imports
    "TC",     # flake8-type-checking: imports used only for typing
    "C4",     # flake8-comprehensions
    "C90",    # mccabe: function complexity
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async: blocking calls inside async functions
    "RET",    # flake8-return
    "T20",    # flake8-print: forgotten print() calls
]
ignore = [
    "ANN401",  # an explicit `Any` is allowed; mypy strict guards the implicit ones
    "D105",    # missing docstring in magic method
    "D107",    # missing docstring in __init__ (Google style documents it in the class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true  # `-> None` is not required on __init__ when its arguments are annotated

[tool.ruff.lint.flake8-bugbear]
# FastAPI calls in argument defaults are the framework's idiom, not a bug
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "pydantic.Field",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime, so their imports must not move under TYPE_CHECKING
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain `assert` is how pytest checks things

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
